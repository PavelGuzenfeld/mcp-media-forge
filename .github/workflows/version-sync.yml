name: Version Sync

on:
  release:
    types: [published]

permissions: {}

jobs:
  sync:
    permissions:
      contents: read
    uses: PavelGuzenfeld/standard/.github/workflows/version-sync.yml@main
    with:
      tag: ${{ github.event.release.tag_name }}
      enable_package_json: true
    secrets:
      app_id: ${{ secrets.RELEASE_APP_ID }}
      app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
